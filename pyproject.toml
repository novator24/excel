[tool.pytest.ini_options]
addopts = "-q -m 'not integration'"
testpaths = [
  "services/backend-api/tests",
  "packages/calculator-engine/tests",
  "packages/excel-generator/tests"
]
markers = [
  "integration: runs against external dependencies such as Postgres containers",
  "integration_service: integration tests using CI-provided Postgres service",
  "integration_container: integration tests using testcontainers runtime"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
