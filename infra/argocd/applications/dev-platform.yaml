apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fertifreight-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://example.com/fertifreight.git
    targetRevision: main
    path: infra/helm/charts/platform
  destination:
    server: https://kubernetes.default.svc
    namespace: fertifreight-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
